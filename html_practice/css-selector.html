<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* this is element selector */
        div{
            /* background-color: red; */
        }
        /* class selector  */
        .red{
            background-color: red;
        }
        /* id selector */
        #green{
            background-color: green ;
        }
        /* child selector  */
        div >p {
            background-color: yellow;
            color: blue ;
        }
        /* desecendent selector  */
        div p {
            background-color: yellow;
            color: blue ;
        }
        /* universal selector  */
        *{
            margin: 0;
            padding: 0;
        }
        /* pseudo selector */
        /* jo visit ki ha vo yellow ho jaye  */
        a:visited{  
            color: yellow
        }
        /* jop visit nahi ki ha vo pink ho jaye  */
        a:link {
            color: violet;
        }
        a:active{
            background-color: red;
        }
        a:hover{
            background-color: yellow;
        }
        p:first-child{
            background-color: aqua;
        }
        /* attribute selector  */
        /* this works where there is x="y" written  */
        p[x="y"]{
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <main class="one">
        <p>i am first</p>
        <p>i am second </p>
    </main>
    <div class="red">
        i am  division 
        <article>
        <p x="y">i am para under div </p>
        </article>
        
    </div>
    <div id="green">
        i am an other division 
    </div>
    <a href="https://www/google.com">go to google</a>
    <a href="https://www/faceboook3.com">go to yt</a>
    
</body>
</html>
